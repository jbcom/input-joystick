name: Bug report
description: Report reproducible incorrect behavior in input-joystick.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, use the private reporting link in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest runnable component, the props you passed, and the pointer or keyboard sequence.
      render: tsx
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: input-joystick, React, browser and device, Node.js, package manager, and operating system.
      placeholder: input-joystick 0.2.1; React 19.2; Safari on iOS 26; Node 26; pnpm 12; macOS 26
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add console output, a screen recording, or other useful details.
